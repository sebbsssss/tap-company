# Production config — app: tap-ops-portal
# Staging config lives in fly.staging.toml (app: tap-ops-portal-staging)

app = "tap-ops-portal"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  OPS_PORTAL_BOT_ENABLED = "true"
  OPS_PORTAL_BASE_URL = "https://tap-ops-portal.fly.dev"
  AUDIT_LOG_PATH = "/data/audit/ticket-auto-reply.log"
  AUTH_DB_PATH = "/data/auth.db"

[mounts]
  source = "ops_portal_data"
  destination = "/data"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[metrics]
  port = 9091
  path = "/metrics"
