name: Deploy Ops Portal to Fly.io

on:
  push:
    branches: [main]
    paths:
      - "portals/ops/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options: [production]

jobs:
  deploy:
    name: Deploy tap-ops-portal
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app via Fly Machines REST API if it doesn't exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Check if app exists
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $FLY_API_TOKEN" \
            "https://api.machines.dev/v1/apps/tap-ops-portal")
          echo "App status check: HTTP $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "App tap-ops-portal already exists."
          else
            echo "Creating tap-ops-portal via Machines REST API..."
            RESULT=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -X POST "https://api.machines.dev/v1/apps" \
              -H "Authorization: Bearer $FLY_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"app_name": "tap-ops-portal", "org_slug": "theassemblyplace-web"}')
            HTTP_STATUS=$(echo "$RESULT" | grep "HTTP_STATUS:" | cut -d: -f2)
            BODY=$(echo "$RESULT" | grep -v "HTTP_STATUS:")
            echo "Response ($HTTP_STATUS): $BODY"
            if [ "$HTTP_STATUS" != "201" ] && [ "$HTTP_STATUS" != "200" ]; then
              echo "Failed to create app via REST API. Falling back to flyctl..."
              flyctl apps create tap-ops-portal --org theassemblyplace-web --machines || \
              flyctl apps create tap-ops-portal --machines || \
              (echo "App creation failed. Manual step needed: flyctl apps create tap-ops-portal --org theassemblyplace-web --machines" && exit 1)
            fi
          fi

      - name: Create volume if it doesn't exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! flyctl volumes list --app tap-ops-portal 2>&1 | grep -q "ops_portal_data"; then
            echo "Creating ops_portal_data volume..."
            flyctl volumes create ops_portal_data \
              --app tap-ops-portal \
              --region sin \
              --size 1 \
              --yes
          else
            echo "Volume ops_portal_data already exists."
          fi

      - name: Stage Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
          SECRET_KEY: ${{ secrets.OPS_PORTAL_SECRET_KEY }}
          OPS_PORTAL_ALLOWED_EMAILS: ${{ secrets.OPS_PORTAL_ALLOWED_EMAILS }}
        run: |
          flyctl secrets set \
            CRM_API_KEY="$CRM_API_KEY" \
            SECRET_KEY="$SECRET_KEY" \
            OPS_PORTAL_ALLOWED_EMAILS="$OPS_PORTAL_ALLOWED_EMAILS" \
            --app tap-ops-portal \
            --stage

      - name: Deploy to Fly.io
        working-directory: portals/ops
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --config fly.toml --remote-only
