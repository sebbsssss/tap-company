name: Deploy Ops Portal to Fly.io

on:
  push:
    branches: [main]
    paths:
      - "portals/ops/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options: [production]

jobs:
  deploy:
    name: Deploy tap-ops-portal
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Fly auth and list accessible orgs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth whoami
          echo "--- Orgs ---"
          flyctl orgs list
          echo "--- Apps ---"
          flyctl apps list || true

      - name: Create app if it doesn't exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl apps list 2>&1 | grep -q "tap-ops-portal"; then
            echo "App tap-ops-portal already exists."
          else
            echo "Creating tap-ops-portal (no --org flag, uses token default org)..."
            flyctl apps create tap-ops-portal --machines
          fi

      - name: Create volume if it doesn't exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! flyctl volumes list --app tap-ops-portal 2>&1 | grep -q "ops_portal_data"; then
            echo "Creating ops_portal_data volume..."
            flyctl volumes create ops_portal_data \
              --app tap-ops-portal \
              --region sin \
              --size 1 \
              --yes
          else
            echo "Volume ops_portal_data already exists."
          fi

      - name: Stage Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
          SECRET_KEY: ${{ secrets.OPS_PORTAL_SECRET_KEY }}
          OPS_PORTAL_ALLOWED_EMAILS: ${{ secrets.OPS_PORTAL_ALLOWED_EMAILS }}
        run: |
          flyctl secrets set \
            CRM_API_KEY="$CRM_API_KEY" \
            SECRET_KEY="$SECRET_KEY" \
            OPS_PORTAL_ALLOWED_EMAILS="$OPS_PORTAL_ALLOWED_EMAILS" \
            --app tap-ops-portal \
            --stage

      - name: Deploy to Fly.io
        working-directory: portals/ops
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --config fly.toml --remote-only
