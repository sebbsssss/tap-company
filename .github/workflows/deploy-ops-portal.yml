name: Deploy Ops Portal to Fly.io

on:
  push:
    branches: [main]
    paths:
      - "portals/ops/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options: [production]

jobs:
  deploy:
    name: Deploy tap-ops-portal
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app if it doesn't exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Check if app exists via Machines API
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $FLY_API_TOKEN" \
            "https://api.machines.dev/v1/apps/tap-ops-portal")
          echo "App status check: HTTP $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "App tap-ops-portal already exists — skipping create."
            exit 0
          fi

          echo "App does not exist. Attempting creation via GraphQL..."
          # Get org ID first
          ORG_DATA=$(curl -s \
            -H "Authorization: Bearer $FLY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query": "{ organizations { nodes { id slug } } }"}' \
            https://api.fly.io/graphql)
          echo "Org query: $ORG_DATA"

          ORG_ID=$(echo "$ORG_DATA" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          nodes = d.get('data', {}).get('organizations', {}).get('nodes', [])
          for n in nodes:
              if n.get('slug') == 'theassemblyplace-web':
                  print(n['id'])
                  break
          ")
          echo "Org ID: $ORG_ID"

          if [ -z "$ORG_ID" ]; then
            echo "ERROR: Could not find org theassemblyplace-web. Token may not have org access."
            exit 1
          fi

          # Try GraphQL mutation to create app
          CREATE_RESULT=$(curl -s \
            -H "Authorization: Bearer $FLY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { createApp(input: { name: \\\"tap-ops-portal\\\", organizationId: \\\"$ORG_ID\\\", runtime: FIRECRACKER }) { app { id name } } }\"}" \
            https://api.fly.io/graphql)
          echo "Create app result: $CREATE_RESULT"

          # Check if creation succeeded
          if echo "$CREATE_RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); exit(0 if d.get('data',{}).get('createApp',{}).get('app') else 1)"; then
            echo "App created successfully via GraphQL!"
          else
            echo "GraphQL creation failed. All automated methods exhausted."
            echo "MANUAL ACTION REQUIRED: flyctl apps create tap-ops-portal --org theassemblyplace-web --machines"
            echo "OR: Update FLY_API_TOKEN GitHub secret to a personal access token."
            exit 1
          fi

      - name: Create volume if it doesn't exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! flyctl volumes list --app tap-ops-portal 2>&1 | grep -q "ops_portal_data"; then
            echo "Creating ops_portal_data volume..."
            flyctl volumes create ops_portal_data \
              --app tap-ops-portal \
              --region sin \
              --size 1 \
              --yes
          else
            echo "Volume ops_portal_data already exists."
          fi

      - name: Stage Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
          SECRET_KEY: ${{ secrets.OPS_PORTAL_SECRET_KEY }}
          OPS_PORTAL_ALLOWED_EMAILS: ${{ secrets.OPS_PORTAL_ALLOWED_EMAILS }}
        run: |
          flyctl secrets set \
            CRM_API_KEY="$CRM_API_KEY" \
            SECRET_KEY="$SECRET_KEY" \
            OPS_PORTAL_ALLOWED_EMAILS="$OPS_PORTAL_ALLOWED_EMAILS" \
            --app tap-ops-portal \
            --stage

      - name: Deploy to Fly.io
        working-directory: portals/ops
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --config fly.toml --remote-only
