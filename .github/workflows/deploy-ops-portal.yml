name: Deploy Ops Portal to Fly.io

on:
  push:
    branches: [main]
    paths:
      - "portals/ops/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options: [production]

jobs:
  deploy:
    name: Deploy tap-ops-portal
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $FLY_API_TOKEN" \
            "https://api.machines.dev/v1/apps/tap-ops-portal")
          if [ "$STATUS" != "200" ]; then
            echo ""
            echo "ERROR: Fly app 'tap-ops-portal' does not exist yet."
            echo "The deploy token cannot create new apps (insufficient permissions)."
            echo ""
            echo "REQUIRED ONE-TIME SETUP (run with a Fly admin token):"
            echo "  flyctl apps create tap-ops-portal --org theassemblyplace-web --machines"
            echo "  flyctl volumes create ops_portal_data --app tap-ops-portal --region sin --size 1 --yes"
            echo ""
            echo "After that, re-run this workflow and it will complete automatically."
            exit 1
          fi
          echo "App tap-ops-portal exists — proceeding with deploy."

      - name: Create volume if it doesn't exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! flyctl volumes list --app tap-ops-portal 2>&1 | grep -q "ops_portal_data"; then
            echo "Creating ops_portal_data volume..."
            flyctl volumes create ops_portal_data \
              --app tap-ops-portal \
              --region sin \
              --size 1 \
              --yes
          else
            echo "Volume ops_portal_data already exists."
          fi

      - name: Stage Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
          SECRET_KEY: ${{ secrets.OPS_PORTAL_SECRET_KEY }}
          OPS_PORTAL_ALLOWED_EMAILS: ${{ secrets.OPS_PORTAL_ALLOWED_EMAILS }}
        run: |
          flyctl secrets set \
            CRM_API_KEY="$CRM_API_KEY" \
            SECRET_KEY="$SECRET_KEY" \
            OPS_PORTAL_ALLOWED_EMAILS="$OPS_PORTAL_ALLOWED_EMAILS" \
            --app tap-ops-portal \
            --stage

      - name: Deploy to Fly.io
        working-directory: portals/ops
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --config fly.toml --remote-only
