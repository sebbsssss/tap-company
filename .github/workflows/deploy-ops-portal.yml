name: Deploy Ops Portal (embedded in tap-company)

on:
  push:
    branches: [main]
    paths:
      - "portals/ops/**"
      - "Dockerfile"
      - "Procfile"
      - "nginx.conf"
      - "fly.toml"

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy tap-company with embedded ops portal
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set ops-portal secrets on tap-company
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
          SECRET_KEY: ${{ secrets.OPS_PORTAL_SECRET_KEY }}
          OPS_PORTAL_ALLOWED_EMAILS: ${{ secrets.OPS_PORTAL_ALLOWED_EMAILS }}
        run: |
          flyctl secrets set \
            CRM_API_KEY="$CRM_API_KEY" \
            SECRET_KEY="$SECRET_KEY" \
            OPS_PORTAL_ALLOWED_EMAILS="$OPS_PORTAL_ALLOWED_EMAILS" \
            --app tap-company \
            --stage

      - name: Deploy to Fly.io (tap-company)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --config fly.toml --remote-only --app tap-company

      - name: Smoke test /ops-portal/health
        run: |
          echo "Waiting 15s for deploy to propagate..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://tap-company.fly.dev/ops-portal/health")
          echo "Health check: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Ops portal live at https://tap-company.fly.dev/ops-portal"
          else
            echo "Health check returned $STATUS — deploy may still be starting"
          fi
