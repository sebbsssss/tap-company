name: Deploy tap-meter-intake (meter reading pipeline)

on:
  push:
    branches: [main]
    paths:
      - "skills/meter-reading-intake/**"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Keep METER_INTAKE_DRY_RUN=true (safe mode)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  deploy:
    name: Deploy tap-meter-intake to Fly (sin)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Verify the app exists — it must be pre-created once by an org-admin:
      #   flyctl apps create tap-meter-intake --org theassemblyplace-web
      # The deploy token (FLY_API_TOKEN) is scoped to tap-company and cannot create apps.
      - name: Verify Fly app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl apps list | grep -q "tap-meter-intake"; then
            echo "App tap-meter-intake found — proceeding."
          else
            echo "::error::App tap-meter-intake does not exist. Create it once with:"
            echo "::error::  flyctl apps create tap-meter-intake --org theassemblyplace-web"
            exit 1
          fi

      # Create persistent volume (idempotent — tolerate "already exists")
      - name: Create data volume (first time only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl volumes list -a tap-meter-intake | grep -q "meter_data" \
            && echo "Volume already exists" \
            || flyctl volumes create meter_data -a tap-meter-intake -r sin --size 1 --yes

      # Set all secrets. ZERNIO_API_KEY and PAPERCLIP_SERVICE_KEY must be in GitHub secrets.
      # ALLOWLISTED_NUMBERS can be empty until ops team provides the E.164 numbers.
      - name: Set Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAPERCLIP_SERVICE_KEY: ${{ secrets.PAPERCLIP_SERVICE_KEY }}
          ALLOWLISTED_NUMBERS: ${{ secrets.METER_ALLOWLISTED_NUMBERS }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: |
          flyctl secrets set \
            ZERNIO_API_KEY="$ZERNIO_API_KEY" \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            PAPERCLIP_API_KEY="$PAPERCLIP_SERVICE_KEY" \
            PAPERCLIP_API_URL="https://tap-agentspace.fly.dev" \
            PAPERCLIP_ISSUE_ID="f3238286-cf83-4d72-93f2-5c3ff8c98200" \
            PAPERCLIP_COMPANY_ID="6daad5d4-11c8-4852-b69d-c560c0b78cde" \
            WEBHOOK_CALLBACK_URL="https://tap-meter-intake.fly.dev/webhook/zernio" \
            ERWAN_CONTACT_ID="${{ secrets.ERWAN_CONTACT_ID }}" \
            ERWAN_INBOX_ID="${{ secrets.ERWAN_INBOX_ID }}" \
            ALLOWLISTED_NUMBERS="$ALLOWLISTED_NUMBERS" \
            METER_INTAKE_DRY_RUN="$DRY_RUN" \
            --app tap-meter-intake \
            --stage

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config skills/meter-reading-intake/fly.toml \
            --remote-only \
            --app tap-meter-intake

      # Register Zernio webhook pointing to the live receiver URL
      - name: Register Zernio webhook (idempotent)
        run: |
          echo "Waiting 20s for app to start..."
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "https://tap-meter-intake.fly.dev/healthz")
          echo "Health: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            curl -s -X POST https://tap-meter-intake.fly.dev/admin/register-webhook \
              -H "Content-Type: application/json" \
              -d '{"callback_url":"https://tap-meter-intake.fly.dev/webhook/zernio"}' \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('Webhook:', d)"
          else
            echo "App not healthy yet — webhook registration skipped. Run manually after stabilisation."
          fi

      - name: Smoke test
        run: |
          curl -sf "https://tap-meter-intake.fly.dev/healthz" \
            && echo "tap-meter-intake is live" \
            || echo "Health check failed — check fly logs -a tap-meter-intake"
