name: Deploy tap-meter-intake (meter reading pipeline)

# Requires GitHub secrets: FLY_METER_INTAKE_TOKEN, ZERNIO_WEBHOOK_SECRET
# Generate deploy token once: flyctl tokens create deploy -a tap-meter-intake --expiry 8760h
# ZERNIO_WEBHOOK_SECRET: generate once (e.g. openssl rand -hex 32), then set in Zernio
#   dashboard under webhook settings AND as this GitHub secret.
# FLY_API_TOKEN is scoped to tap-company and cannot be reused here.

on:
  push:
    branches: [main]
    paths:
      - "skills/meter-reading-intake/**"

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy tap-meter-intake to Fly (sin)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Create persistent volume (idempotent)
      - name: Create data volume (first time only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_METER_INTAKE_TOKEN }}
        run: |
          flyctl volumes list -a tap-meter-intake | grep -q "meter_data" \
            && echo "Volume already exists" \
            || flyctl volumes create meter_data -a tap-meter-intake -r sin --size 1 --yes

      # Set all runtime secrets on the Fly app
      # NOTE: METER_INTAKE_DRY_RUN is intentionally excluded — it is operator-owned.
      # Toggle live/dry-run manually: flyctl secrets set METER_INTAKE_DRY_RUN=false -a tap-meter-intake
      - name: Set Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_METER_INTAKE_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAPERCLIP_SERVICE_KEY: ${{ secrets.PAPERCLIP_SERVICE_KEY }}
          ALLOWLISTED_NUMBERS: ${{ secrets.METER_ALLOWLISTED_NUMBERS }}
          WEBHOOK_SECRET: ${{ secrets.ZERNIO_WEBHOOK_SECRET }}
        run: |
          flyctl secrets set \
            ZERNIO_API_KEY="$ZERNIO_API_KEY" \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            PAPERCLIP_API_KEY="$PAPERCLIP_SERVICE_KEY" \
            PAPERCLIP_API_URL="https://tap-agentspace.fly.dev" \
            PAPERCLIP_ISSUE_ID="f3238286-cf83-4d72-93f2-5c3ff8c98200" \
            PAPERCLIP_COMPANY_ID="6daad5d4-11c8-4852-b69d-c560c0b78cde" \
            WEBHOOK_CALLBACK_URL="https://tap-meter-intake.fly.dev/webhook/zernio" \
            IRWAN_CONTACT_ID="${{ secrets.IRWAN_CONTACT_ID }}" \
            IRWAN_INBOX_ID="${{ secrets.IRWAN_INBOX_ID }}" \
            ALLOWLISTED_NUMBERS="$ALLOWLISTED_NUMBERS" \
            WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            --app tap-meter-intake \
            --stage

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_METER_INTAKE_TOKEN }}
        run: |
          # Deploy from the skill directory so Dockerfile COPY paths resolve correctly
          flyctl deploy \
            --config fly.toml \
            --remote-only \
            --app tap-meter-intake
        working-directory: skills/meter-reading-intake

      # Register Zernio webhook pointing at the live receiver URL (idempotent via ensure_webhook)
      - name: Register Zernio webhook
        run: |
          echo "Waiting 20s for app to start..."
          sleep 20
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://tap-meter-intake.fly.dev/healthz")
          echo "Health: HTTP $HEALTH"
          if [ "$HEALTH" != "200" ]; then
            echo "App not healthy ($HEALTH) — aborting"
            exit 1
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 15 -X POST \
            https://tap-meter-intake.fly.dev/admin/register-webhook \
            -H "Content-Type: application/json" \
            -d '{"callback_url":"https://tap-meter-intake.fly.dev/webhook/zernio"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Webhook registration failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Smoke test /healthz
        run: |
          curl -sf "https://tap-meter-intake.fly.dev/healthz" \
            && echo "tap-meter-intake is live ✓" \
            || (echo "Health check failed — check: fly logs -a tap-meter-intake" && exit 1)
