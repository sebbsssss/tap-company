# fly.toml app configuration file generated for tap-company on 2026-05-28T04:03:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tap-company'
primary_region = 'sin'

[build]

[env]
  OCCUPANCY_PORT = '8082'
  OPS_PORTAL_BASE_URL = 'https://tap-company.fly.dev/ops-portal'
  OPS_PORTAL_BOT_ENABLED = 'true'
  AUDIT_LOG_PATH = '/data/audit/ticket-auto-reply.log'
  AUTH_DB_PATH = '/data/auth.db'
  FRONTEND_PATH = '/app/portals/ops/backend/frontend'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
