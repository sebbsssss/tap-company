worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile     on;

  server {
    listen 8080;

    # Health check — served by occupancy server
    location = /healthz {
      proxy_pass http://127.0.0.1:8082;
    }

    # Ops portal — strip /ops-portal prefix before forwarding to FastAPI
    location /ops-portal/ {
      proxy_pass         http://127.0.0.1:8001/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_redirect     off;
    }

    # Bare /ops-portal redirect to trailing slash
    location = /ops-portal {
      return 301 /ops-portal/;
    }

    # Everything else — occupancy dashboard and API
    location / {
      proxy_pass       http://127.0.0.1:8082;
      proxy_set_header Host $host;
    }
  }
}
