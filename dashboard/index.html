<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TAP — Co-Living Occupancy</title>
  <link rel="stylesheet" href="/dashboard/styles.css" />
</head>
<body>
  <!-- Loading overlay — hidden once TAP_DATA_READY resolves -->
  <div id="tap-loading" style="
    position:fixed;inset:0;background:#FBFAF6;display:flex;align-items:center;
    justify-content:center;z-index:9999;flex-direction:column;gap:12px;
    font-family:ui-monospace,monospace;font-size:12px;color:#8A8A82;
    letter-spacing:0.14em;text-transform:uppercase;">
    <div>Loading occupancy data…</div>
  </div>

  <div id="root"></div>

  <script>
    // Suppress noisy Recharts deprecation warnings (defaultProps on function components).
    (function () {
      const origError = console.error;
      console.error = function (...args) {
        const msg = args && args[0];
        if (typeof msg === 'string' && msg.includes('Support for defaultProps will be removed')) return;
        return origError.apply(console, args);
      };
    })();
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Recharts -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <!-- Live data layer (sets window.TAP_DATA_READY promise) -->
  <script src="/dashboard/src/data.js"></script>

  <!-- Tweaks shell -->
  <script type="text/babel" src="/dashboard/tweaks-panel.jsx" data-presets="react"></script>

  <!-- App scripts (order matters — atoms → charts → blocks → screens → app) -->
  <script type="text/babel" src="/dashboard/src/atoms.jsx" data-presets="react"></script>
  <script type="text/babel" src="/dashboard/src/charts.jsx" data-presets="react"></script>
  <script type="text/babel" src="/dashboard/src/filterbar.jsx" data-presets="react"></script>
  <script type="text/babel" src="/dashboard/src/insights.jsx" data-presets="react"></script>
  <script type="text/babel" src="/dashboard/src/drilldown.jsx" data-presets="react"></script>
  <script type="text/babel" src="/dashboard/src/screens.jsx" data-presets="react"></script>
  <script type="text/babel" src="/dashboard/src/app.jsx" data-presets="react"></script>
</body>
</html>
